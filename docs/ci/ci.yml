name: Gravity In Hand CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: AST, Lint, Typecheck & Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Python AST syntax and PROJECT_STATE.json validity
        run: |
          python -c 'import ast, json, pathlib; [ast.parse(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.py")]; json.load(open("PROJECT_STATE.json", encoding="utf-8")); print("[OK] AST and PROJECT_STATE.json verified")'

      - name: Verify shell syntax on run.sh
        run: |
          bash -n run.sh

      - name: Run Ruff linter
        run: |
          ruff check src tests

      - name: Run Mypy strict type checker
        run: |
          mypy src tests

      - name: Run Pytest suite
        run: |
          pytest -v
